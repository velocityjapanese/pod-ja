name: Probe TTS voices on runner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install edge-tts requests

      - name: Run TTS probe
        run: |
          python - <<'EOF'
          import asyncio, json, urllib.request
          import edge_tts
          print("edge_tts version:", edge_tts.__version__, flush=True)
          print("default WSS:", edge_tts.constants.WSS_URL, flush=True)
          results = {}

          async def try_edge(label, voice):
              try:
                  c = edge_tts.Communicate("Hello, this is a voice test for the podcast.", voice, boundary="WordBoundary")
                  audio = bytearray()
                  bounds = 0
                  async with asyncio.timeout(40):
                      async for chunk in c.stream():
                          if chunk.get("type") == "audio":
                              audio.extend(chunk.get("data", b""))
                          elif chunk.get("type") == "WordBoundary":
                              bounds += 1
                  path = f"edge_{label}.mp3"
                  open(path, "wb").write(bytes(audio))
                  results[f"edge_{label}"] = {"ok": True, "bytes": len(audio), "bounds": bounds}
                  print(f"edge_{label}: OK bytes={len(audio)} bounds={bounds}", flush=True)
              except Exception as e:
                  results[f"edge_{label}"] = {"ok": False, "error": f"{type(e).__name__}: {str(e)[:200]}"}
                  print(f"edge_{label}: FAIL {type(e).__name__} {str(e)[:200]}", flush=True)

          async def main():
              # Variant A: stock edge-tts, no URL patching
              await try_edge("stock_nanami", "ja-JP-NanamiNeural")
              # Variant B: current repo patch (forced api.msedgeservices.com URL)
              import edge_tts.constants, edge_tts.communicate
              token = getattr(edge_tts.constants, "TRUSTED_CLIENT_TOKEN", "6A5AA1D4EAFF4E9FB37E23D68491D6F4")
              url = ("wss://api.msedgeservices.com/tts/cognitiveservices/websocket/v1"
                     f"?Ocp-Apim-Subscription-Key={token}")
              edge_tts.constants.WSS_URL = url
              edge_tts.communicate.WSS_URL = url
              await try_edge("patched_keita", "ja-JP-KeitaNeural")

          asyncio.run(main())

          import urllib.parse
          for voice in ["nova", "onyx", "shimmer", "echo"]:
              try:
                  text = urllib.parse.quote("Hello, this is a voice test for the podcast.")
                  req = urllib.request.Request(
                      f"https://text.pollinations.ai/{text}?model=openai-audio&voice={voice}",
                      headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=90) as resp:
                      data = resp.read()
                  path = f"polli_{voice}.mp3"
                  open(path, "wb").write(data)
                  results[f"polli_{voice}"] = {"ok": True, "bytes": len(data),
                                               "content_type": resp.headers.get("Content-Type", "")}
                  print(f"polli_{voice}: OK bytes={len(data)} {resp.headers.get('Content-Type', '')}", flush=True)
              except Exception as e:
                  results[f"polli_{voice}"] = {"ok": False, "error": f"{type(e).__name__}: {str(e)[:200]}"}
                  print(f"polli_{voice}: FAIL {type(e).__name__} {str(e)[:200]}", flush=True)

          json.dump(results, open("probe_results.json", "w"), indent=1)
          print("RESULTS:", json.dumps(results), flush=True)
          EOF

      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: tts-probe-${{ github.run_number }}
          path: |
            probe_results.json
            edge_*.mp3
            polli_*.mp3
          retention-days: 7
